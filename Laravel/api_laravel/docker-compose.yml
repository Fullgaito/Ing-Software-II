services:
  php:
    container_name: laravel
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www
      - node_modules: /var/www/node_modules
      - vendor: /var/www/vendor
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: sh -c "composer install && npm install && php artisan serve --host=0.0.0.0"
  db:
    image: mysql:8.0
    container_name: mysql
    environment:
      -DB_CONNECTION: mysql
      -DB_HOST: 
      -DB_PORT: 3306
      -DB_DATABASE: laravel
      -DB_USERNAME=: laravel
      -DB_PASSWORD: secret
    volume:
      -db_data: /var/lib/mysql
    restart:
      - always
    ports:
      - "3306:3306"
volumes:
  .:
  db_data:
  node_modules:
  vendor:
